
global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/private

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 50s
    timeout server 50s

    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# Main frontend for web traffic on port 80
frontend infrastructure_frontend
    bind *:80
    mode http
    default_backend infrastructure_web_servers

# Backend pool balancing web-01 and web-02
backend infrastructure_web_servers
    mode http
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    server web-01 192.168.56.11:80 check
    server web-02 192.168.56.12:80 check

# Separate stats dashboard on port 8404
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /
    stats refresh 5s

